name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            cd /home/ubuntu/projects/RestoRouenV2
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}

            cat > .env << EOF
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ vars.POSTGRES_DB }}
            API_URL=${{ vars.API_URL }}
            FRONTEND_URL=${{ vars.FRONTEND_URL }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
            PORT_GATEWAY=${{ vars.PORT_GATEWAY }}
            PORT_AUTH=${{ vars.PORT_AUTH }}
            PORT_APP=${{ vars.PORT_APP }}
            PORT_MEDIA=${{ vars.PORT_MEDIA }}
            GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            STRIPE_PRODUCT_STARTER=${{ vars.STRIPE_PRODUCT_STARTER }}
            STRIPE_PRODUCT_GROWTH=${{ vars.STRIPE_PRODUCT_GROWTH }}
            STRIPE_PRODUCT_PRO=${{ vars.STRIPE_PRODUCT_PRO }}
            MEDIA_SECRET=${{ secrets.MEDIA_SECRET }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION=${{ vars.AWS_REGION }}
            S3_BUCKET=${{ vars.S3_BUCKET }}
            CLOUDFRONT_DOMAIN=${{ vars.CLOUDFRONT_DOMAIN }}
            INACTIVE_THRESHOLD_DAYS=${{ vars.INACTIVE_THRESHOLD_DAYS }}
            EOF

            docker compose down
            docker compose up --build -d

      - name: Discord notification
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}
          noprefix: true
          title: "🚀 Déploiement ${{ job.status == 'success' && 'réussi' || 'échoué' }}"
          description: |
            **Branche: ** `${{ github.ref_name }}`
            **Commit:** ${{ github.event.head_commit.message }}
            **Auteur:** ${{ github.actor }}
          color: ${{ job.status == 'success' && '0x15e286' || '0xff0000' }}
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
