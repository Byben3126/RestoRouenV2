services:
  # --- BASE DE DONNÉES ---
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '127.0.0.1:5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- API ---
  api:
    image: ghcr.io/byben3126/restorouen-api:latest
    # `docker compose up --build` construit l'image en local ; en prod elle est tirée depuis ghcr.io
    build: .
    container_name: api
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: ${PORT}
      API_URL: ${API_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      PROMOTION_TOKEN_SECRET: ${PROMOTION_TOKEN_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN}
      INACTIVE_THRESHOLD_DAYS: ${INACTIVE_THRESHOLD_DAYS}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRODUCT_STARTER: ${STRIPE_PRODUCT_STARTER}
      STRIPE_PRODUCT_GROWTH: ${STRIPE_PRODUCT_GROWTH}
      STRIPE_PRODUCT_PRO: ${STRIPE_PRODUCT_PRO}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
    ports:
      - '127.0.0.1:3080:${PORT}'

volumes:
  postgres_data:
