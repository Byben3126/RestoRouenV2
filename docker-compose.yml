services:
  # --- BASE DE DONNÉES ---
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- MICROSERVICE AUTH ---
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth
    container_name: auth-service
    command: node dist/apps/auth/main.js
    depends_on:
      - db
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - API_URL=${API_URL}
      - PORT_GATEWAY=${PORT_GATEWAY}
      - PORT_AUTH=${PORT_AUTH}
      - FRONTEND_URL=${FRONTEND_URL}

  # --- GATEWAY ---
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: gateway
    container_name: gateway-service
    command: sh -c "npx prisma migrate deploy && node dist/apps/gateway/main.js"
    depends_on:
      - db
      - auth-service
    environment:
      - DATABASE_URL=${WORKER_DATABASE_URL}
      - PORT_GATEWAY=${PORT_GATEWAY}
      - PORT_AUTH=${GATEWAY_DATABASE_URL}
      - FRONTEND_URL=${FRONTEND_URL}

    ports:
      - '3080:${PORT_GATEWAY}'

volumes:
  postgres_data:
